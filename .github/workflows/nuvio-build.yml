name: Build NuvioTVSmart with VOYO branding
on:
  push:
    branches: [main, integrate/nuvio-tvsmart-voyo-theme]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VOYO
        uses: actions/checkout@v4
      - name: Checkout upstream NuvioTVSmart
        uses: actions/checkout@v4
        with:
          repository: NuvioMedia/NuvioTVSmart
          ref: cfec25654f0580028d9a78a41b037bcd48af2a29
          path: nuvio-source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuvio-source/package-lock.json
      - name: Install dependencies
        working-directory: nuvio-source
        run: npm ci
      - name: Build Nuvio web app
        working-directory: nuvio-source
        run: npm run build
      - name: Validate Nuvio build output
        run: |
          test -s nuvio-source/dist/index.html
          test -s nuvio-source/dist/app.bundle.js
          test -s nuvio-source/dist/css/base.css || find nuvio-source/dist/css -maxdepth 1 -type f -print
          test -n "$(find nuvio-source/dist/css -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -s nuvio-source/LICENSE
          test -s nuvio-source/README.md
      - name: Apply VOYO theme to compiled Nuvio UI
        run: |
          CSS_FILE="nuvio-source/dist/css/themes.css"
          test -s "$CSS_FILE"
          cat >> "$CSS_FILE" <<'CSS'

          /* VOYO brand override — cyan, blue and violet. */
          :root {
            --focus-color: #438bff;
            --focus-color-rgb: 67 139 255;
            --focus-bg: #13233e;
            --secondary-color: #438bff;
            --secondary-color-rgb: 67 139 255;
            --secondary-variant: #a78bfa;
            --on-secondary: #08090d;
            --voyo-cyan: #2de0df;
            --voyo-blue: #438bff;
            --voyo-violet: #762dff;
          }
          a:focus, button:focus, input:focus, select:focus, textarea:focus,
          .focusable:focus, .focused, .selected, [aria-selected="true"] {
            outline-color: #438bff !important;
          }
          .home-nav-item.selected,
          .modern-sidebar-nav-item.selected,
          .library-picker-option.focused,
          .button-primary, .primary-button, .btn-primary,
          button.primary, a.primary, [data-variant="primary"] {
            background: linear-gradient(105deg, #2de0df 0%, #438bff 48%, #762dff 100%) !important;
            border-color: transparent !important;
            color: #08090d !important;
          }
          .home-poster-card.focused .home-poster-frame,
          .search-result-card.focused .search-result-poster-wrap,
          .seeall-card.focused .seeall-card-poster-wrap {
            border-color: #438bff !important;
            box-shadow: 0 0 0 2px #438bff !important;
          }
          /* Responsive adaptation: phone/tablet portrait, desktop, and TV/D-pad. */
          :root {
            --tv-safe-gutter: clamp(12px, 3vw, 56px);
            --tv-safe-gutter-wide: clamp(14px, 3.6vw, 72px);
          }
          html, body, #app, .screen {
            max-width: 100%;
          }
          img, video, canvas, svg {
            max-width: 100%;
          }
          @media screen and (max-width: 700px) {
            :root {
              --tv-safe-gutter: 16px;
              --tv-safe-gutter-wide: 16px;
              --tv-card-gap: 10px;
              --tv-button-height: 48px;
              --tv-button-padding-x: 16px;
              --tv-control-size: 48px;
              --tv-control-icon-size: 24px;
              --tv-caption-text: 12px;
              --tv-secondary-text: 14px;
              --tv-body-text: 16px;
              --tv-subtitle-text: 22px;
              --tv-title-text: clamp(26px, 7vw, 36px);
            }
            html, body {
              font-size: 16px;
              overflow-x: hidden;
              overflow-y: auto;
              -webkit-text-size-adjust: 100%;
            }
            #app, .screen {
              width: 100%;
              min-width: 0;
              max-width: 100vw;
            }
            #app {
              height: 100dvh;
              overflow-x: hidden;
              overflow-y: auto;
            }
            .screen {
              height: 100dvh;
              overflow-x: hidden;
              overflow-y: auto;
            }
            button, input, select, textarea, a {
              max-width: 100%;
              overflow-wrap: anywhere;
            }
            input, select, textarea {
              font-size: 16px !important;
            }
            .row {
              margin: 16px;
            }
            .card {
              width: min(42vw, 180px);
              height: auto;
              aspect-ratio: 16 / 9;
              margin-right: 8px;
            }
            .card.focused {
              transform: scale(1.02);
            }
            /* Keep split login/connect layouts inside the phone viewport. */
            .login-screen, .auth-screen, .connect-screen, .pairing-screen,
            .login-layout, .auth-layout, .connect-layout, .pairing-layout,
            .login-container, .auth-container, .connect-container, .pairing-container {
              width: 100% !important;
              max-width: 100vw !important;
              min-width: 0 !important;
              padding-left: 16px !important;
              padding-right: 16px !important;
              box-sizing: border-box !important;
              gap: 16px !important;
            }
            .login-screen, .auth-screen, .connect-screen, .pairing-screen,
            .login-layout, .auth-layout, .connect-layout, .pairing-layout {
              display: flex !important;
              flex-direction: column !important;
              align-items: stretch !important;
              justify-content: flex-start !important;
            }
            .login-screen > *, .auth-screen > *, .connect-screen > *, .pairing-screen > *,
            .login-layout > *, .auth-layout > *, .connect-layout > *, .pairing-layout > * {
              width: 100% !important;
              max-width: 100% !important;
              min-width: 0 !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }
            h1, h2, h3, p {
              overflow-wrap: anywhere;
            }
          }
          @media screen and (min-width: 701px) and (max-width: 1100px) {
            :root {
              --tv-safe-gutter: 24px;
              --tv-safe-gutter-wide: 28px;
              --tv-title-text: clamp(32px, 4.4vw, 48px);
              --tv-subtitle-text: clamp(22px, 2.6vw, 28px);
            }
            html, body {
              font-size: 18px;
            }
            #app, .screen {
              max-width: 100vw;
            }
          }
          @media screen and (min-width: 1101px) {
            html, body, #app, .screen {
              overflow: hidden;
            }
            .focusable:focus, button:focus, input:focus, select:focus,
            textarea:focus, a:focus, .focused {
              outline: 3px solid #438bff !important;
              outline-offset: 4px;
            }
            .focusable:focus, .focused {
              scroll-margin: 40px;
            }
          }
          /* Real Nuvio screen selectors: compact profile and home navigation on phones. */
          @media screen and (max-width: 700px) {
            .profile-screen {
              width: 100% !important;
              height: 100dvh !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
            }
            .profile-main-layer {
              width: 100% !important;
              max-width: 100% !important;
              padding: 24px 16px 96px !important;
              box-sizing: border-box !important;
              transform: none !important;
            }
            .profile-grid, .profile-grid-compact {
              display: flex !important;
              flex-wrap: wrap !important;
              justify-content: center !important;
              gap: 16px !important;
              min-height: 0 !important;
            }
            .profile-card, .profile-grid-compact .profile-card {
              width: min(42vw, 170px) !important;
              max-width: 170px !important;
              padding: 8px !important;
            }
            .profile-avatar-ring, .profile-card.focused .profile-avatar-ring,
            .profile-grid-compact .profile-avatar-ring,
            .profile-grid-compact .profile-card.focused .profile-avatar-ring {
              width: clamp(84px, 26vw, 116px) !important;
              height: clamp(84px, 26vw, 116px) !important;
              margin: 8px auto !important;
              border-width: 3px !important;
            }
            .profile-avatar, .profile-card.focused .profile-avatar,
            .profile-grid-compact .profile-avatar,
            .profile-grid-compact .profile-card.focused .profile-avatar {
              width: calc(clamp(84px, 26vw, 116px) - 14px) !important;
              height: calc(clamp(84px, 26vw, 116px) - 14px) !important;
              font-size: clamp(34px, 10vw, 48px) !important;
            }
            .profile-name, .profile-grid-compact .profile-name {
              margin-top: 8px !important;
              font-size: 17px !important;
              overflow-wrap: anywhere !important;
            }
            .profile-badge, .profile-grid-compact .profile-badge {
              margin-top: 6px !important;
              min-height: 0 !important;
              font-size: 13px !important;
              letter-spacing: .5px !important;
            }
            .profile-primary-dot {
              width: 28px !important;
              height: 28px !important;
              right: -4px !important;
              bottom: -4px !important;
              font-size: 15px !important;
              border-width: 2px !important;
            }
            .profile-hint {
              margin-top: 24px !important;
              font-size: 14px !important;
              text-align: center !important;
            }
            .home-shell, .home-screen-shell {
              width: 100% !important;
              max-width: 100vw !important;
              height: 100dvh !important;
              overflow: hidden !important;
            }
            .home-sidebar {
              position: fixed !important;
              z-index: 1000 !important;
              left: 12px !important;
              right: 12px !important;
              bottom: max(8px, env(safe-area-inset-bottom)) !important;
              top: auto !important;
              width: auto !important;
              height: 68px !important;
              min-height: 68px !important;
              padding: 6px 10px !important;
              display: flex !important;
              flex-direction: row !important;
              justify-content: space-around !important;
              align-items: center !important;
              border-radius: 36px !important;
              background: rgb(24 24 28 / .94) !important;
              backdrop-filter: blur(18px);
              box-shadow: 0 4px 28px rgb(0 0 0 / .45) !important;
            }
            .home-sidebar .home-nav-item {
              width: auto !important;
              min-width: 0 !important;
              height: 54px !important;
              flex: 1 1 0 !important;
              margin: 0 2px !important;
              padding: 4px !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: center !important;
              align-items: center !important;
              gap: 2px !important;
              border-radius: 28px !important;
            }
            .home-sidebar .home-nav-icon {
              width: 24px !important;
              height: 24px !important;
              font-size: 24px !important;
            }
            .home-sidebar .home-nav-label {
              display: block !important;
              font-size: 10px !important;
              line-height: 1.1 !important;
              white-space: nowrap !important;
            }
            .home-main {
              width: 100% !important;
              height: 100dvh !important;
              max-width: 100vw !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
              padding-bottom: 88px !important;
            }
            .home-screen-shell .home-main {
              padding-left: 0 !important;
              padding-right: 0 !important;
            }
            .home-hero, .home-hero-section, .hero-section, .hero-banner {
              max-width: 100% !important;
              width: 100% !important;
              min-width: 0 !important;
            }
            .home-hero img, .home-hero-section img, .hero-section img, .hero-banner img {
              max-width: 100% !important;
              object-fit: cover !important;
            }
            .home-row, .home-section, .home-content-row, .catalog-row {
              max-width: 100% !important;
            }
            .home-poster-card, .search-result-card, .seeall-card {
              max-width: 44vw !important;
            }
          }
          @media screen and (min-width: 701px) {
            .home-sidebar {
              position: relative;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
              animation-duration: 0.01ms !important;
              animation-iteration-count: 1 !important;
              scroll-behavior: auto !important;
              transition-duration: 0.01ms !important;
            }
          }

          /* VOYO mobile cinema layout, inspired by the supplied third reference image. */
          @media screen and (max-width: 700px) {
            html, body {
              width: 100% !important;
              min-width: 0 !important;
              margin: 0 !important;
              overflow-x: clip !important;
              background: #08090d !important;
            }
            #app, #app > *, .screen, .home-shell, .home-screen-shell {
              box-sizing: border-box !important;
              width: 100vw !important;
              max-width: 100vw !important;
              min-width: 0 !important;
              margin-left: 0 !important;
              margin-right: 0 !important;
            }
            .home-shell, .home-screen-shell {
              height: 100dvh !important;
              overflow: hidden !important;
              background: #08090d !important;
            }
            .home-main {
              box-sizing: border-box !important;
              width: 100vw !important;
              max-width: 100vw !important;
              min-width: 0 !important;
              height: 100dvh !important;
              margin: 0 !important;
              padding: 0 0 calc(100px + env(safe-area-inset-bottom)) !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
              background: linear-gradient(180deg, #08090d 0%, #101117 70%, #08090d 100%) !important;
            }
            .home-modern-stage {
              position: relative !important;
              width: 100vw !important;
              max-width: 100vw !important;
              min-width: 0 !important;
              height: min(68dvh, 650px) !important;
              min-height: 440px !important;
              margin: 0 !important;
              overflow: hidden !important;
            }
            .home-modern-stage::after {
              content: "";
              position: absolute;
              z-index: 2;
              inset: 35% 0 0;
              pointer-events: none;
              background: linear-gradient(180deg, transparent 0%, rgb(8 9 13 / .25) 35%, #08090d 100%);
            }
            .home-modern-hero, .home-hero, .home-hero-card,
            .home-hero-backdrop, .home-modern-hero-backdrop,
            .home-modern-hero-media, .home-modern-hero-art {
              max-width: 100vw !important;
              min-width: 0 !important;
            }
            .home-modern-rows-viewport {
              position: relative !important;
              inset: auto !important;
              width: 100% !important;
              height: auto !important;
              max-height: none !important;
              overflow: visible !important;
              padding-top: 18px !important;
              padding-bottom: 16px !important;
              background: #08090d !important;
            }
            .home-modern-rows-scroll, .home-modern-catalogs {
              gap: 24px !important;
            }
            .home-screen-shell .home-row {
              margin: 0 0 8px !important;
              max-width: 100vw !important;
            }
            .home-screen-shell .home-row-head {
              padding-left: 20px !important;
              padding-right: 16px !important;
              margin-bottom: 12px !important;
            }
            .home-screen-shell .home-row-title {
              font-size: 23px !important;
              font-weight: 700 !important;
              letter-spacing: -.45px !important;
            }
            .home-screen-shell .home-track {
              gap: 12px !important;
              padding-left: 20px !important;
              padding-right: 20px !important;
              scroll-padding-left: 20px !important;
            }
            .home-screen-shell.home-layout-modern .home-poster-card:not(.is-landscape),
            .home-screen-shell.home-layout-modern .home-seeall-card {
              flex-basis: 132px !important;
              min-width: 132px !important;
              max-width: 132px !important;
            }
            .home-screen-shell.home-layout-modern .home-poster-card:not(.is-landscape) .home-poster-frame {
              height: 198px !important;
            }
            .home-screen-shell .home-continue-card {
              flex-basis: min(78vw, 340px) !important;
              min-width: min(78vw, 340px) !important;
              max-width: min(78vw, 340px) !important;
            }
            .home-screen-shell .home-continue-media {
              height: 150px !important;
              border-radius: 18px !important;
            }
            .home-screen-shell .home-poster-frame,
            .home-screen-shell .home-continue-media {
              border-radius: 18px !important;
            }
            .modern-sidebar-shell, .home-sidebar {
              position: fixed !important;
              z-index: 9999 !important;
              left: 18px !important;
              right: 18px !important;
              bottom: max(10px, env(safe-area-inset-bottom)) !important;
              top: auto !important;
              width: auto !important;
              height: 72px !important;
              min-height: 72px !important;
              max-width: none !important;
              margin: 0 !important;
              padding: 5px 8px !important;
              display: flex !important;
              flex-direction: row !important;
              justify-content: space-around !important;
              align-items: center !important;
              gap: 2px !important;
              border: 1px solid rgb(255 255 255 / .12) !important;
              border-radius: 40px !important;
              background: rgb(28 28 33 / .94) !important;
              backdrop-filter: blur(20px) saturate(150%);
              box-shadow: 0 8px 30px rgb(0 0 0 / .4) !important;
            }
            .modern-sidebar-shell > *, .home-sidebar > *,
            .modern-sidebar-shell .modern-sidebar-nav-item,
            .home-sidebar .home-nav-item {
              flex: 1 1 0 !important;
              width: auto !important;
              min-width: 0 !important;
              max-width: none !important;
              height: 58px !important;
              margin: 0 !important;
              padding: 4px 2px !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: center !important;
              align-items: center !important;
              gap: 3px !important;
              border-radius: 32px !important;
              white-space: nowrap !important;
            }
            .modern-sidebar-shell .modern-sidebar-nav-item span,
            .home-sidebar .home-nav-label {
              display: block !important;
              font-size: 10px !important;
              line-height: 1.1 !important;
              white-space: nowrap !important;
            }
            .modern-sidebar-shell svg, .home-sidebar .home-nav-icon {
              width: 24px !important;
              height: 24px !important;
              flex: 0 0 24px !important;
            }
            .modern-sidebar-shell .selected, .home-sidebar .selected {
              background: linear-gradient(110deg, rgb(45 224 223 / .18), rgb(67 139 255 / .18), rgb(118 45 255 / .18)) !important;
              color: #fff !important;
            }
            .home-main .home-modern-hero-meta-line,
            .home-main .home-modern-hero-secondary {
              max-width: calc(100vw - 40px) !important;
            }
          }
          CSS
      - name: Prepare GitHub Pages files
        run: |
          rm -rf site
          mkdir -p site
          cp -a nuvio-source/dist/. site/
          cp nuvio-source/LICENSE site/LICENSE-NUVIO-GPL-3.0
          cp nuvio-source/README.md site/README-NUVIO-UPSTREAM.md
          cp README.md site/README-VOYO.md
          cat > site/VOYO-ATTRIBUTION.txt <<'EOF'
          VOYO branded build of NuvioTVSmart
          Upstream repository: https://github.com/NuvioMedia/NuvioTVSmart
          Upstream commit: https://github.com/NuvioMedia/NuvioTVSmart/commit/cfec25654f0580028d9a78a41b037bcd48af2a29
          License: GNU General Public License v3. See LICENSE-NUVIO-GPL-3.0.
          VOYO's cyan-blue-violet theme override is defined in .github/workflows/nuvio-build.yml in the VOYO source repository.
          This build is independent and is not an official Nuvio release.
          EOF
          test -s site/index.html
          test -s site/app.bundle.js
          CSS_FILE="site/css/themes.css"
          test -s "$CSS_FILE"
          grep -q '#2de0df' "$CSS_FILE"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
