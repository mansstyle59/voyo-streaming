name: Validate legacy VOYO files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-legacy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VOYO repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source in ("index.html", "addons.html"):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {source}")
              for index, script in enumerate(scripts, 1):
                  Path(f"/tmp/{Path(source).stem}-{index}.js").write_text(script, encoding="utf-8")
              print(f"Extracted {len(scripts)} script(s) from {source}")
          PY
          node --check /tmp/index-1.js
          node --check /tmp/addons-1.js
      - name: Install smoke-test dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Run legacy VOYO smoke tests
        run: node tests/smoke.mjs
