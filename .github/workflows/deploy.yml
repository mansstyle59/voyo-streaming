name: Deploy VOYO to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source in ("index.html", "addons.html"):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {source}")
              for index, script in enumerate(scripts, 1):
                  Path(f"/tmp/{Path(source).stem}-{index}.js").write_text(script, encoding="utf-8")
              print(f"Extracted {len(scripts)} script(s) from {source}")
          PY
          node --check /tmp/index-1.js
          node --check /tmp/addons-1.js
      - name: Probe configured Stremio manifest (diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from urllib.error import URLError, HTTPError
          url = "https://addon-stremio-fs-public.stremio-fs-public.workers.dev/eyJ0IjoiODQ4YmMzNzRlMjk2MTYyNTgxYTA1ZDVkYTVlZmU3ZWEiLCJyIjpmYWxzZSwiYyI6WyJkZXJuaWVycy1maWxtcyIsImRlcmluaWVycy1zZXJpZXMiLCJzZXJpZXMtdGFnLW1pbmlzZXJpZXMiXSwidiI6ZmFsc2V9/manifest.json"
          try:
              req = urllib.request.Request(url, headers={"Accept": "application/json", "Origin": "https://mansstyle59.github.io"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  raw = response.read()
                  print("Manifest HTTP status:", response.status)
                  print("Access-Control-Allow-Origin:", response.headers.get("Access-Control-Allow-Origin", "(missing)"))
                  data = json.loads(raw)
                  print("Manifest id:", data.get("id", "(missing)"))
                  print("Manifest name:", data.get("name", "(missing)"))
                  print("Resources:", data.get("resources", []))
                  print("Catalogs:", [{"type": c.get("type"), "id": c.get("id"), "name": c.get("name")} for c in data.get("catalogs", []) if isinstance(c, dict)])
          except Exception as error:
              print("Manifest diagnostic failed:", repr(error))
              print("The static site will still deploy; inspect addon availability/CORS separately.")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
